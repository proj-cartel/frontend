services:
  nginx:
    image: nginx:alpine
    container_name: cartel-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - cartel-network

networks:
  cartel-network:
    driver: bridge
